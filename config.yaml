# provider 引用这里的渠道；协议由 players.yaml 显式指定。
# OpenAI 地址保留 /v1，Anthropic SDK 在 /anthropic 根地址后追加 /v1/messages。
llm:
  timeout_seconds: 900
  channels:
    hub:
      base_url: https://hub.oaifree.com/v1
      api_key_env: HUB_API_KEY
    hub_anthropic:
      base_url: https://hub.oaifree.com/anthropic
      api_key_env: HUB_API_KEY
