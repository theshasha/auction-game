# LLM 全局配置：timeout 对所有 provider 生效
llm:
  timeout_seconds: 900

# 6 名 AI 玩家：名字（模型名） + 人设 + 各自的 provider/model
# provider 可选：modal（Kimi-K3）/ hub（oaifree 中转）/ anthropic / gemini（后两者当前无玩家使用，代码保留）
# hub 玩家可加 protocol 字段：responses（默认，OpenAI responses API）/ chat（/v1/chat/completions）
players:
  - name: "Kimi-K3"
    persona: "做你心中的自己"
    provider: "modal"
    model: "moonshotai/Kimi-K3"
  - name: "deepseek-v4-pro"
    persona: "做你心中的自己"
    provider: "hub"
    model: "deepseek-v4-pro"
    protocol: "chat"
  - name: "gemini-3.1-pro-preview"
    persona: "做你心中的自己"
    provider: "hub"
    model: "gemini-3.1-pro-preview"
  - name: "gpt-5.6-sol"
    persona: "做你心中的自己"
    provider: "hub"
    model: "gpt-5.6-sol"
  - name: "gemini-3.7-flash"
    persona: "做你心中的自己"
    provider: "hub"
    model: "gemini-3.7-flash"
  - name: "deepseek-v4-flash"
    persona: "做你心中的自己"
    provider: "hub"
    model: "deepseek-v4-flash"
    protocol: "chat"
