# 稳定目录键供 players.yaml / config.test_model 引用；名称只在这里维护。
# models_dev 是精确公共来源，与 Hub API ID 分开；预算由离线能力快照生成。
# high 支持以同步条目的 reasoning_options 为准，公开设置按 protocol 选择。
models:
  gpt_astra:
    name: GPT姐姐
    model: gpt-6-astra
    provider: hub
    protocol: responses
    models_dev:
      provider: openai
      model: gpt-6-astra
  gpt_sol:
    name: GPT妹妹
    model: gpt-6.1-sol
    provider: hub
    protocol: responses
    models_dev:
      provider: openai
      model: gpt-6.1-sol
  gpt_luna:
    name: GPT小妹妹
    model: gpt-6-luna
    provider: hub
    protocol: chat
    models_dev:
      provider: openai
      model: gpt-6-luna
  deepseek_flash:
    name: deepseek妹妹
    model: deepseek-flash
    provider: hub
    protocol: chat
    models_dev:
      provider: deepseek
      # 上游官方条目保留旧键，但 canonical ID 明确对应当前型号；同步时校验。
      model: deepseek-v4-flash
      canonical_model_id: deepseek/deepseek-v4.1-flash
  gemini_flash:
    name: 双子妹妹
    model: gemini-3.8-flash
    provider: hub
    protocol: chat
    models_dev:
      provider: google
      model: gemini-3.8-flash
  gemini_argon:
    name: 双子姐姐
    model: gemini-4-argon
    provider: hub
    protocol: chat
    # 官方能力支持 medium，按快照自动选择该推理档位。
    models_dev:
      provider: google
      model: gemini-4-argon
  glm_pro:
    name: GLM姐姐
    model: glm-5.3
    provider: hub
    protocol: chat
    models_dev:
      provider: zhipuai
      model: glm-5.3
  glm_flash:
    name: GLM妹妹
    model: glm-5.3-flash
    provider: hub
    protocol: chat
    models_dev:
      provider: zhipuai
      model: glm-5.3-flash
  deepseek_pro:
    name: deepseek姐姐
    model: deepseek-v4-pro
    provider: hub
    protocol: chat
    models_dev:
      provider: deepseek
      model: deepseek-v4-pro
  grok:
    name: GROK
    model: grok-4.7
    provider: hub
    protocol: responses
    models_dev:
      provider: xai
      model: grok-4.7
  claude_sonnet:
    name: CLAUDE妹妹
    model: claude-sonnet-5-5
    provider: hub
    protocol: chat
    models_dev:
      provider: anthropic
      model: claude-sonnet-5-5
  claude_opus:
    name: CLAUDE姐姐
    model: claude-opus-5-5
    provider: hub
    protocol: chat
    models_dev:
      provider: anthropic
      model: claude-opus-5-5
  mimo_pro:
    name: MIMO姐姐
    model: mimo-v2.6-pro
    provider: hub
    protocol: chat
    models_dev:
      provider: xiaomi
      model: mimo-v2.6-pro
  mimo_flash:
    name: MIMO妹妹
    model: mimo-v2.6-flash
    provider: hub
    protocol: chat
    models_dev:
      provider: xiaomi
      model: mimo-v2.6-flash
  kimi_k3:
    name: KIMI姐姐
    model: kimi-k3
    provider: hub
    protocol: chat
    # 官方来源未列 medium，推理档位沿用渠道默认。
    models_dev:
      provider: moonshotai
      model: kimi-k3
