# models.yaml 的 provider 引用这里的渠道；OpenAI 地址保留 /v1。
# --test-model 时全员使用的模型目录键。
test_model: deepseek_flash
prompts:
  enable_predictions: false
  enable_personas: true
  # 开启后把 configs/writing_style.md 接在每位玩家系统提示的最后。
  enable_writing_style: true
llm:
  # 同时请求的任务数上限，1 为串行。
  max_concurrency: 10
  timeout_seconds: 900
  channels:
    hub:
      base_url: https://hub.oaifree.com/v1
      api_key_env: HUB_API_KEY
    # 同一个 hub 的 Anthropic 接口；Anthropic SDK 自己追加 /v1/messages。
    hub_anthropic:
      base_url: https://hub.oaifree.com
      api_key_env: HUB_API_KEY
    # Anthropic 接口；地址不带 /v1。
    oaipro:
      base_url: https://api.oaipro.com
      api_key_env: OAIPRO_API_KEY
