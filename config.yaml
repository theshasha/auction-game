# LLM 全局配置：timeout 对所有 provider 生效
llm:
  timeout_seconds: 60

# 6 名 AI 玩家：名字（模型名） + 人设 + 各自的 provider/model
# provider 可选：modal（Kimi-K3）/ hub（oaifree responses API）/ anthropic（oaifree claude）/ gemini（官方直连）
players:
  - name: "Kimi-K3"
    persona: "做你心中的自己"
    provider: "modal"
    model: "moonshotai/Kimi-K3"
  - name: "deepseek-v4-pro"
    persona: "做你心中的自己"
    provider: "hub"
    model: "deepseek-v4-pro"
  - name: "gemini-3.1-pro-preview"
    persona: "做你心中的自己"
    provider: "hub"
    model: "gemini-3.1-pro-preview"
  - name: "gpt-5.6-sol"
    persona: "做你心中的自己"
    provider: "hub"
    model: "gpt-5.6-sol"
  - name: "claude-opus-4-6"
    persona: "做你心中的自己"
    provider: "anthropic"
    model: "claude-opus-4-6"
  - name: "gemini-flash-latest"
    persona: "做你心中的自己"
    provider: "gemini"
    model: "gemini-flash-latest"
